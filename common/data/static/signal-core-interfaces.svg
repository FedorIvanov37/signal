<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" role="img" aria-labelledby="title desc"><title id="title">Signal core and interfaces</title><desc id="desc">GUI or CLI can host an optional HTTP API with its own client interface. All transaction paths reach the same core and processing host. Dashed arrows mean API activation; solid arrows mean requests and results.</desc><rect width="1000" height="730" rx="10" fill="#0d1822"/><g font-family="Segoe UI,Arial,sans-serif" fill="#e6edf3"><text x="500" y="38" text-anchor="middle" font-size="25" fill="#e6edf3">Signal: one core, three interfaces</text><rect x="375" y="64" width="250" height="50" rx="5" fill="#172631" stroke="#738895" stroke-width="1.5"/><text x="500.0" y="95.0" text-anchor="middle" font-size="21" fill="#e6edf3">API client</text><path d="M500 114 V248 M496 121 L500 114 L504 121 M496 241 L500 248 L504 241" fill="none" stroke="#92b3c7" stroke-width="1.5"/><text x="598" y="157" text-anchor="middle" font-size="15" fill="#adc0ce">HTTP requests</text><text x="598" y="179" text-anchor="middle" font-size="15" fill="#adc0ce">and responses</text><rect x="35" y="204" width="930" height="327" rx="7" fill="none" stroke="#425564" stroke-width="1.3"/><text x="325" y="231" text-anchor="middle" font-size="15" fill="#adc0ce">One Signal instance</text><rect x="70" y="248" width="220" height="65" rx="5" fill="#172631" stroke="#738895" stroke-width="1.5"/><text x="180.0" y="286.5" text-anchor="middle" font-size="21" fill="#e6edf3">GUI · Interactive</text><rect x="390" y="248" width="220" height="65" rx="5" fill="#193b50" stroke="#79bbdb" stroke-width="1.5"/><text x="500.0" y="286.5" text-anchor="middle" font-size="21" fill="#e6edf3">HTTP API</text><rect x="710" y="248" width="220" height="65" rx="5" fill="#172631" stroke="#738895" stroke-width="1.5"/><text x="820.0" y="286.5" text-anchor="middle" font-size="21" fill="#e6edf3">CLI · Job runner</text><path d="M290 280 H390" stroke="#92b3c7" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/><path d="M383 276 L390 280 L383 284" stroke="#92b3c7" stroke-width="1.5" fill="none"/><path d="M710 280 H610" stroke="#92b3c7" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/><path d="M617 276 L610 280 L617 284" stroke="#92b3c7" stroke-width="1.5" fill="none"/><text x="340" y="269" text-anchor="middle" font-size="13" fill="#adc0ce">Start API</text><text x="660" y="269" text-anchor="middle" font-size="13" fill="#adc0ce">Start API</text><path d="M180 313 V427 M176 320 L180 313 L184 320 M176 420 L180 427 L184 420" fill="none" stroke="#92b3c7" stroke-width="1.5"/><path d="M500 313 V427 M496 320 L500 313 L504 320 M496 420 L500 427 L504 420" fill="none" stroke="#92b3c7" stroke-width="1.5"/><path d="M820 313 V427 M816 320 L820 313 L824 320 M816 420 L820 427 L824 420" fill="none" stroke="#92b3c7" stroke-width="1.5"/><text x="330" y="355" text-anchor="middle" font-size="14" fill="#adc0ce">Stays open for user actions</text><text x="330" y="377" text-anchor="middle" font-size="14" fill="#adc0ce">API can run alongside it</text><text x="666" y="355" text-anchor="middle" font-size="14" fill="#adc0ce">Builds and executes a Job</text><text x="666" y="377" text-anchor="middle" font-size="14" fill="#adc0ce">--api-mode keeps it running</text><rect x="70" y="427" width="860" height="66" rx="5" fill="#193b50" stroke="#79bbdb" stroke-width="1.5"/><text x="500.0" y="466.0" text-anchor="middle" font-size="21" fill="#e6edf3">Shared transaction-processing core</text><text x="500" y="517" text-anchor="middle" font-size="15" fill="#adc0ce">Configuration · Specification · Host connection · Transaction queue</text><path d="M500 531 V612 M496 538 L500 531 L504 538 M496 605 L500 612 L504 605" fill="none" stroke="#92b3c7" stroke-width="1.5"/><text x="667" y="575" text-anchor="middle" font-size="16" fill="#adc0ce">ISO 8583 over TCP</text><rect x="350" y="612" width="300" height="54" rx="5" fill="#172631" stroke="#738895" stroke-width="1.5"/><text x="500.0" y="645.0" text-anchor="middle" font-size="21" fill="#e6edf3">Processing host</text><text x="500" y="696" text-anchor="middle" font-size="14" fill="#adc0ce">Dashed arrows: start the API. Solid arrows: requests and results.</text><text x="500" y="717" text-anchor="middle" font-size="14" fill="#adc0ce">The API has its own HTTP interface, hosted within the GUI or CLI process.</text><rect x="55" y="64" width="250" height="50" rx="5" fill="#172631" stroke="#738895" stroke-width="1.5"/>
